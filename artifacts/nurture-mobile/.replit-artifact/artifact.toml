kind = "mobile"
previewPath = "/nurture-mobile/"
title = "Nurture — Mobile App"
version = "1.0.0"
id = "artifacts/nurture-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/nurture-mobile/" ]
localPort = 20419

[services.development]
run = "pnpm --filter @workspace/nurture-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nurture-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/nurture-mobile", "run", "serve" ]

[services.env]
PORT = "20419"
BASE_PATH = "/nurture-mobile/"
